<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bash — gift registries and shagun funds</title>
<meta name="description" content="Set up a wishlist or a shagun fund, share one link, and let your people jump in. No sign-in required.">
<meta property="og:title" content="Bash — gifting with the volume turned up">
<meta property="og:description" content="Pick a gift or send shagun in seconds. No sign-in required.">
<meta name="theme-color" content="#E6007A">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎉</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --fuchsia:#E6007A;--tangerine:#FF7A29;--gold:#F2B705;--indigo:#1B1035;
  --cream:#FFF7F0;--ink:#1B1035;--muted:#6E5F80;--card:#FFFFFF;--field:#FFFFFF;
  --line:rgba(27,16,53,.12);--wash:#FFE9F3;--ok:#0E8A5F;--danger:#C2185B;
  --grad:linear-gradient(100deg,var(--fuchsia),var(--tangerine));
  --display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--cream:#150C22;--ink:#F4EDFB;--muted:#B3A5C9;--card:#20152F;--field:#2A1D3B;--line:rgba(244,237,251,.14);--wash:#3A1530;--ok:#4FD1A0;--danger:#FF6FA8;color-scheme:dark}
}
:root[data-theme="dark"]{--cream:#150C22;--ink:#F4EDFB;--muted:#B3A5C9;--card:#20152F;--field:#2A1D3B;--line:rgba(244,237,251,.14);--wash:#3A1530;--ok:#4FD1A0;--danger:#FF6FA8;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:hidden}
@supports (overflow:clip){html{overflow-x:clip}}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;min-height:100%;overflow-x:hidden;position:relative;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
a{color:var(--fuchsia)}
[hidden]{display:none!important}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;z-index:0;pointer-events:none}
.b1{width:420px;height:420px;background:var(--fuchsia);top:-160px;right:-160px}
.b2{width:340px;height:340px;background:var(--gold);top:240px;left:-180px;opacity:.35}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 22px 0;max-width:1180px;margin:0 auto;position:relative;z-index:1}
.brand{font-family:var(--display);font-weight:800;font-size:1.4rem;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
.brand span{color:var(--fuchsia)}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px;position:relative;z-index:1}
.narrow{max-width:720px;margin-left:auto;margin-right:auto}
footer{padding:40px 22px 50px;text-align:center;color:var(--muted);font-size:.85rem;position:relative;z-index:1;max-width:1180px;margin:0 auto}

/* type */
.display{font-family:var(--display);font-weight:800;letter-spacing:-.02em}
h1,h2,h3{font-family:var(--display);margin:0}
.h2{font-size:1.45rem;font-weight:800;letter-spacing:-.01em;margin-bottom:6px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
p{margin:0 0 12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--grad);color:#fff;border:none;padding:14px 24px;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none;white-space:nowrap;min-height:48px}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.6;cursor:progress}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.ghost:hover{border-color:var(--fuchsia);filter:none}
.btn.sm{padding:9px 14px;font-size:.9rem;min-height:40px;border-radius:10px}
.btn.wa{background:#1FA855}
.btn.block{width:100%}
.link{background:none;border:none;padding:6px 2px;font:inherit;font-size:.88rem;font-weight:600;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ink)}
.link.danger:hover{color:var(--danger)}
:focus-visible{outline:2.5px solid var(--fuchsia);outline-offset:2px;border-radius:6px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* hero */
.hero{padding:52px 0 8px}
.hero h1{font-size:clamp(2.4rem,9vw,3.3rem);line-height:1.04;margin:0 0 16px}
.hero h1 em{font-style:normal;color:var(--fuchsia)}
.lede{color:var(--muted);font-size:1.08rem;line-height:1.55;max-width:36ch;margin:0 0 28px}
.steps{display:flex;flex-direction:column;gap:16px;margin:48px 0 8px}
.step{display:flex;gap:14px;align-items:flex-start}
.step .n{font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--fuchsia);flex:none;width:34px}
.step p{margin:0;color:var(--muted)}
.step strong{color:var(--ink);display:block;margin-bottom:2px;font-family:var(--display)}

/* sections */
.section{margin-top:40px}
.panel{background:var(--card);border-radius:18px;padding:20px;border:1px solid var(--line)}
.page-head{padding:36px 0 4px}
.page-head h1{font-size:clamp(2rem,7vw,2.6rem);line-height:1.08}
.back{display:inline-block;margin-top:22px;font-size:.9rem;color:var(--muted);text-decoration:none;font-weight:600}
.back:hover{color:var(--ink)}

/* forms */
form{margin:0}
.field{display:block;margin:0 0 18px;border:0;padding:0;min-width:0}
.field>span,.field legend{display:block;font-weight:600;font-size:.95rem;margin-bottom:7px;padding:0}
.opt{font-style:normal;font-weight:400;color:var(--muted);font-size:.85rem;margin-left:4px}
.field small{display:block;color:var(--muted);font-size:.83rem;margin-top:6px}
input[type=text],input[type=url],input[type=number],input[type=date],input:not([type]),textarea{width:100%;padding:13px 15px;border-radius:12px;border:2px solid var(--line);background:var(--field);color:var(--ink);font:inherit;font-size:1rem}
textarea{resize:vertical;min-height:84px}
input:focus,textarea:focus{outline:none;border-color:var(--fuchsia)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.form-error{color:var(--danger);font-weight:600;font-size:.9rem;margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chip span{display:inline-block;padding:9px 14px;border-radius:99px;border:2px solid var(--line);font-weight:600;font-size:.92rem;background:var(--field);cursor:pointer;user-select:none}
.chip input:checked+span{border-color:var(--fuchsia);background:var(--wash)}
.chip input:focus-visible+span{outline:2.5px solid var(--fuchsia);outline-offset:2px}
.switch{display:flex;gap:14px;align-items:flex-start;cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.track{flex:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .2s;margin-top:2px}
.track::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked+.track{background:var(--fuchsia)}
.switch input:checked+.track::after{transform:translateX(18px)}
.switch input:focus-visible+.track{outline:2.5px solid var(--fuchsia);outline-offset:2px}
.switch small{display:block;color:var(--muted);font-size:.86rem}
.fund-fields{margin-top:18px;padding-left:60px}
@media (max-width:520px){.fund-fields{padding-left:0}}

/* your bashes */
.mine{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.mine li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.emo{font-size:1.5rem;line-height:1}
.grow{flex:1;min-width:0}
.grow strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--display)}

/* invite header (guest view) */
.invite{padding:34px 0 0}
.invite .emo-big{font-size:3rem;line-height:1;display:block;margin-bottom:14px}
.invite h1{font-size:clamp(2.5rem,10vw,3.6rem);line-height:1.02;letter-spacing:-.025em;font-weight:800;word-break:break-word}
.host{margin:12px 0 0;font-size:1.05rem;color:var(--muted)}
.host strong{color:var(--ink)}
.when{display:inline-flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:700;padding:6px 13px;border-radius:99px;background:var(--gold);color:var(--indigo)}
.pill.soft{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.letter{margin-top:22px;background:var(--card);border-left:4px solid var(--fuchsia);border-radius:4px 14px 14px 4px;padding:16px 18px;white-space:pre-line;font-size:1.02rem}
.letter cite{display:block;margin-top:8px;font-style:normal;color:var(--muted);font-size:.9rem}

/* gifts */
.gifts{list-style:none;margin:16px 0 0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.gift{display:flex;gap:14px;padding:18px 18px;border-top:1px dashed var(--line);align-items:flex-start}
.gift:first-child{border-top:0}
.gift-main{flex:1;min-width:0}
.gift-name{font-family:var(--display);font-weight:700;font-size:1.12rem;line-height:1.25;word-break:break-word}
.gift-meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px;font-size:.9rem;color:var(--muted)}
.gift-meta .price{color:var(--ink);font-weight:700}
.gift-meta a{font-weight:600}
.gift-note{margin:8px 0 0;font-size:.92rem;color:var(--muted)}
.gift-side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.gift.taken .gift-name{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--fuchsia);color:var(--muted)}
.gift.mine-claim{background:var(--wash)}
.tag{display:inline-block;font-size:.8rem;font-weight:700;padding:5px 11px;border-radius:99px;border:1.5px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.yours{border-color:var(--fuchsia);color:var(--fuchsia);background:var(--card)}
.claimline{margin:8px 0 0;font-size:.9rem}
.claimline .tag{margin-right:6px}
.inline-form{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.inline-form .field{margin-bottom:12px}
.gift-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:520px){
  .gift{flex-direction:column;gap:10px}
  .gift-side{align-items:flex-start;flex-direction:row;flex-wrap:wrap}
  .gift-actions{justify-content:flex-start}
}
.empty{padding:26px 20px;text-align:center;color:var(--muted)}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}

/* shagun */
.meter{margin:14px 0 6px}
.meter-bar{height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.meter-fill{height:100%;background:var(--grad);border-radius:99px;transition:width .6s ease}
.meter-label{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:.92rem;flex-wrap:wrap}
.meter-label strong{font-family:var(--display);font-size:1.15rem}
.amounts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.amt{padding:11px 16px;border-radius:12px;border:2px solid var(--line);background:var(--field);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;min-height:46px}
.amt[aria-pressed="true"]{border-color:var(--fuchsia);background:var(--wash)}
.paybox{text-align:center}
.pay-amount{font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1.1;margin:4px 0 2px}
.qr{display:inline-block;background:#fff;padding:10px;border-radius:14px;margin:14px 0 6px;line-height:0}
.qr svg{width:200px;height:200px}
.upi-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 0 18px}
.upi-row code{font-family:var(--body);font-weight:700;background:var(--field);border:1px solid var(--line);padding:8px 12px;border-radius:10px;word-break:break-all}
.divider{height:1px;background:var(--line);margin:20px 0}
.contribs{list-style:none;margin:14px 0 0;padding:0}
.contribs li{display:flex;gap:12px;justify-content:space-between;padding:12px 0;border-top:1px dashed var(--line)}
.contribs li:first-child{border-top:0}
.contribs .amt-v{font-weight:700;white-space:nowrap}
.thanks{text-align:center;padding:8px 0}
.thanks .big{font-size:2.6rem;line-height:1;display:block;margin-bottom:10px}

/* share */
.share-link{display:flex;gap:8px;margin:12px 0}
.share-link input{flex:1;min-width:0;font-size:.92rem}
.note-box{background:var(--wash);border-radius:14px;padding:14px 16px;margin-top:16px;font-size:.92rem}
.note-box strong{display:block;margin-bottom:2px}

.banner{background:var(--card);border:2px solid var(--gold);border-radius:16px;padding:16px 18px;margin-top:22px}
.banner h3{font-size:1.15rem;margin-bottom:4px}
.owner-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:.9rem}
.cta-own{margin-top:48px;text-align:center}
.cta-own p{color:var(--muted)}
.loading{padding:80px 0;text-align:center;color:var(--muted)}
.loading .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--fuchsia);margin:0 4px;animation:bounce 1s infinite ease-in-out}
.loading .dot:nth-child(2){animation-delay:.15s;background:var(--tangerine)}
.loading .dot:nth-child(3){animation-delay:.3s;background:var(--gold)}
@keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--indigo);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:.95rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 40px);text-align:center;box-shadow:0 8px 24px rgba(27,16,53,.3)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast{background:#F4EDFB;color:#1B1035}}
.toast.show{opacity:1;transform:translate(-50%,0)}


/* photos, chip-in, extras */
.gift-top{display:flex;gap:14px;flex:1;min-width:0;align-items:flex-start}
.thumb{flex:none;width:76px;height:76px;border-radius:12px;object-fit:cover;background:var(--line);display:block}
.mini-meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px;max-width:300px}
.mini-meter>div{height:100%;background:var(--grad);border-radius:99px;transition:width .6s ease}
.fundline{margin:6px 0 0;font-size:.9rem;color:var(--muted)}
.fundline strong{color:var(--ink)}
.tag.done{border-color:var(--ok);color:var(--ok)}
.tag.group{border-color:var(--gold);color:var(--ink);background:var(--card)}
.photo-pick{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.photo-pick .ph{flex:none;width:76px;height:76px;border-radius:12px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:1.5rem;overflow:hidden;background:var(--field);color:var(--muted)}
.photo-pick .ph img{width:100%;height:100%;object-fit:cover}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.chip-list{list-style:none;margin:10px 0 0;padding:0;font-size:.88rem}
.chip-list li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;color:var(--muted)}
.chip-list li strong{color:var(--ink);font-weight:600}
.plus-card{border:2px solid var(--fuchsia)}
.plus-list{margin:0 0 18px;padding-left:20px;color:var(--ink)}
.plus-list li{margin:4px 0}
.danger-zone{margin-top:48px;padding-top:20px;border-top:1px dashed var(--line)}
.recover{margin-top:28px}
.recover form{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.recover input{flex:1;min-width:200px}
.sub-switch{margin-top:6px}
@media (max-width:520px){.thumb,.photo-pick .ph{width:64px;height:64px}}

.foot-nav{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;margin-bottom:10px}
.foot-nav a{color:var(--muted);font-weight:600;text-decoration:none}
.foot-nav a:hover{color:var(--ink);text-decoration:underline}
footer a{color:var(--muted)}
.price-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media (max-width:520px){.price-grid{grid-template-columns:1fr}}
.plan-name{font-family:var(--display);font-size:1.1rem}
/* milestones */
.mile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px}
.mile-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.mile-top strong{font-family:var(--display);font-size:1.08rem}
.mile-bar{position:relative;height:12px;border-radius:99px;background:var(--line);margin:0 6px}
.mile-fill{height:100%;border-radius:99px;background:var(--grad);transition:width .7s ease}
.mile-stop{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--card);border:3px solid var(--line);transform:translate(-50%,-50%)}
.mile-stop.hit{border-color:var(--fuchsia);background:var(--gold)}
.mile-labels{display:flex;justify-content:space-between;gap:8px;margin-top:12px;font-size:.8rem;color:var(--muted);font-weight:600}
.mile-labels span:nth-child(2){text-align:center}
.mile-labels span:last-child{text-align:right}
.mile-labels .hit{color:var(--ink)}
.reveal{margin-top:16px;background:var(--wash);border-radius:14px;padding:14px 16px;animation:pop .5s ease}
.reveal p{margin:6px 0 0;white-space:pre-line}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
/* quiz */
.quiz-card{border:2px solid var(--gold)}
.quiz-head{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.quiz-emoji{font-size:2rem;line-height:1}
.quiz-q{font-size:1.3rem;line-height:1.25;margin:6px 0 14px}
.quiz-opts{display:grid;gap:10px}
.quiz-opt{text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--field);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;min-height:52px}
.quiz-opt:hover{border-color:var(--fuchsia)}
.quiz-opt.picked{border-color:var(--fuchsia);background:var(--wash)}
.quiz-dots{display:flex;gap:6px;margin:10px 0 12px}
.quiz-dots span{flex:1;height:6px;border-radius:99px;background:var(--line)}
.quiz-dots .done{background:var(--fuchsia)}
.quiz-dots .now{background:var(--gold)}
.quiz-result{text-align:center;padding:10px 0 4px}
.quiz-score{font-family:var(--display);font-weight:800;font-size:3.4rem;line-height:1}
.quiz-score span{font-size:1.6rem;color:var(--muted)}
.quiz-lb-title{font-size:1rem;margin:20px 0 8px}
.lb{list-style:none;margin:0;padding:0}
.lb li{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px}
.lb li:nth-child(odd){background:var(--field)}
.lb li.me{outline:2px solid var(--fuchsia)}
.lb-rank{width:28px;text-align:center;font-weight:700}
.lb-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.lb-score{font-weight:700;font-variant-numeric:tabular-nums}
.quiz-review{margin:10px 0 14px;padding-left:20px}
.quiz-review li{margin-bottom:12px}
.quiz-review li span{display:block}
.quiz-review .ok{color:var(--ok);font-weight:600}
.quiz-review .no{color:var(--danger);font-weight:600}
.q-edit{margin-top:14px}
.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.opt-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.opt-row input[type=radio]{width:20px;height:20px;accent-color:var(--fuchsia);flex:none}

  const W = c.width = innerWidth * devicePixelRatio, Hh = c.height = innerHeight * devicePixelRatio;
  const colors = ['#E6007A', '#FF7A29', '#F2B705', '#7B5CFF', '#1FA855'];
  const bits = Array.from({ length: 150 }, () => ({

  }));
  const start = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, W, Hh);
    bits.forEach(b => { b.vy += .45 * devicePixelRatio; b.x += b.vx; b.y += b.vy; b.vx *= .99; b.r += b.vr;

}

// Shrinks a photo to a light JPEG in the browser, then uploads it.
function shrinkImage(file, max) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth * s));
      c.height = Math.max(1, Math.round(img.naturalHeight * s));
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error("Couldn't read that photo.")), 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("That file doesn't look like a photo. Try a JPG or PNG.")); };
    img.src = url;
  });
}
async function uploadPhoto(file) {

}

function readDetails(form) {
  const f = new FormData(form);
  const s = k => String(f.get(k) || '').trim();
  const d = {
    occasion: s('occasion') || 'other', title: s('title'), host_name: s('host_name'),
    event_date: s('event_date') || null, message: s('message') || null, host_email: s('host_email') || null,
    reveal_message: s('reveal_message') || null,
    fund_enabled: !!f.get('fund_enabled'), upi_id: s('upi_id') || null, upi_name: s('upi_name') || null,
    fund_goal: s('fund_goal') ? Math.round(Number(s('fund_goal'))) : null
  };
  if (!d.title) return { error: 'Give your Bash a name.' };
  if (!d.host_name) return { error: 'Add your name so guests know whose Bash it is.' };
  if (d.host_email && !EMAIL_RE.test(d.host_email)) return { error: "That email doesn't look right." };
  if (d.upi_id && !UPI_RE.test(d.upi_id)) return { error: 'That UPI ID doesn\'t look right. It should look like name@okicici.' };
  if (d.fund_enabled && !d.upi_id) return { error: 'Add your UPI ID to turn on the shagun fund.' };
  if (d.fund_goal !== null && !(d.fund_goal > 0)) return { error: 'The goal needs to be a number above zero, or leave it blank.' };
  return { data: d };
}
const fundToggle = el => { el.closest('form').querySelector('.fund-fields').hidden = !el.checked; };

  }

    return `
      <div class="paybox">

        </div>

  }
  return `
    <form data-form="pay" data-key="${key}" novalidate>
      <div class="amounts" role="group" aria-label="Choose an amount">
        ${o.chips.map(c => `<button type="button" class="amt" data-act="amt" data-key="${key}" data-v="${c.v}" aria-pressed="${!P.custom && P.amount === c.v}">${esc(c.label)}</button>`).join('')}

      <div class="btn-row">

        ${o.cancel ? `<button class="btn ghost" type="button" data-act="chip-cancel">Cancel</button>` : ''}

/* ---------- create ---------- */
function viewCreate() {
  document.title = 'Start a Bash';
  app.innerHTML = `
    <div class="narrow">
    <a class="back" href="#/">‹ Back</a>

      <div style="margin-top:24px"><button class="btn block" type="submit">Create my Bash</button></div>
    </form>
    </div>`;
  H['change:fund_enabled'] = fundToggle;
  H['submit:create'] = async (form, btn) => {
    const { data, error } = readDetails(form);
    if (error) return showError(form, error);
    busy(btn, true, 'Creating…');
    try {
      const res = await api.createRegistry(data);
      rememberBash({ slug: res.slug, title: data.title, occasion: data.occasion }, res.admin_token);

      location.hash = '#/m/' + enc(res.slug) + '/' + enc(res.admin_token);

  };
}

        <span class="emo" aria-hidden="true">${occ(r.occasion).emoji}</span>
        <h1 style="margin-top:8px">${esc(r.title)}</h1>
        ${r.plus ? '<span class="pill" style="margin-top:10px">Bash Plus ✓</span>' : ''}
        <div class="btn-row" style="margin-top:10px">
          <button class="link" data-act="toggle-details">${S.editDetails ? 'Close details' : 'Edit details'}</button>
          <a class="link" href="#/r/${enc(r.slug)}">See what guests see</a>
        </div>
      </div>

      ${!S.editDetails && !r.host_email ? `
      <div class="note-box"><strong>Add your email</strong>Get a ping when gifts are reserved or cash comes in, and a way back in if you lose this page. <button class="link" data-act="toggle-details">Add email</button></div>` : ''}

      <section class="section">

          <input type="text" readonly value="${esc(link)}" aria-label="Guest link">

        </div>
        <div class="btn-row">
          <a class="btn wa sm" href="https://wa.me/?text=${enc(waText)}" target="_blank" rel="noopener noreferrer">Send on WhatsApp</a>
          ${navigator.share ? '<button class="btn ghost sm" data-act="native-share">More ways to share</button>' : ''}
        </div>
        <div class="note-box"><strong>Your private edit link</strong>Anyone with this link can change your Bash, so keep it to yourself. <button class="link" data-act="copy" data-text="${esc(manageUrl(r.slug, tok))}">Copy edit link</button></div>
      </section>

      ${r.plus ? '' : `
      <section class="section" id="plus-sec">
        <div class="panel plus-card">
          <span class="pill">Bash Plus</span>
          <h3 style="font-size:1.35rem;margin:12px 0 6px">Make this Bash extra, for ${inr(PLUS_PRICE)}</h3>
          <ul class="plus-list">
            <li>Photos on every gift, so the list looks the part</li>
            <li>Chip-in gifts, so friends can club together on something big</li>
            <li>Email alerts when gifts are reserved or cash comes in</li>
          </ul>
          <button class="btn" data-act="upgrade">Upgrade for ${inr(PLUS_PRICE)}</button>
          <p class="muted small" style="margin:10px 0 0">One-time payment for this Bash. Pay by UPI or card, handled securely by Razorpay. By upgrading you agree to our <a href="terms.html">Terms</a> and <a href="refund.html">Refund policy</a>.</p>
        </div>
      </section>`}

      ${r.items.length ? `<section class="section"><h2 class="h2">Milestones</h2>${milestoneHtml(r, true)}</section>` : ''}
      </aside>

      <div class="main">
      ${S.editDetails ? `
      <section class="section panel" id="details-sec">
        <form data-form="details" novalidate>
          ${detailsFields(r)}
          <div class="btn-row" style="margin-top:20px"><button class="btn sm" type="submit">Save details</button><button class="btn ghost sm" type="button" data-act="toggle-details">Cancel</button></div>
        </form>
      </section>` : ''}

      <section class="section">
        <div class="section-head">
          <div><h2 class="h2">Gifts</h2><p class="muted small" style="margin:0">${r.items.length ? (normal.length ? `${claimed} of ${normal.length} claimed` : `${r.items.length} chip-in ${r.items.length === 1 ? 'gift' : 'gifts'}`) : 'Nothing here yet'}</p></div>
          ${claimed ? `<button class="link" data-act="reveal">${S.reveal ? "Hide who's getting what" : "Show who's getting what"}</button>` : ''}
        </div>
        ${r.items.length ? `<ul class="gifts">${r.items.map(giftRow).join('')}</ul>` : ''}
        <div class="panel" style="margin-top:14px">
          <h3 style="font-size:1.1rem;margin-bottom:12px">Add a gift</h3>
          ${itemForm({})}
        </div>
      </section>

      ${r.fund_enabled ? `
      <section class="section">
        <h2 class="h2">Shagun fund</h2>
        <p class="muted small" style="margin:0">Guests pay ${esc(r.upi_id)} directly and tell you here. Check your UPI app to confirm it arrived.</p>
        <div class="meter">
          ${r.fund_goal ? `<div class="meter-bar"><div class="meter-fill" style="width:${Math.min(100, r.raised / r.fund_goal * 100)}%"></div></div>` : ''}
          <div class="meter-label"><span><strong>${inr(r.raised)}</strong> from ${people(r.contributors)}</span>${r.fund_goal ? `<span class="muted">Goal ${inr(r.fund_goal)}</span>` : ''}</div>
        </div>
        ${shagun.length ? `<ul class="contribs">${shagun.map(c => `
          <li><div><strong>${esc(c.name)}</strong>${c.message ? `<div class="muted small">“${esc(c.message)}”</div>` : ''}</div><span class="amt-v">${inr(c.amount)}</span></li>`).join('')}</ul>`
          : '<p class="muted small">No shagun yet. It shows up here as guests send it.</p>'}
      </section>` : ''}

      ${quizEditor()}

      <section class="danger-zone">
        <button class="link danger" data-act="delete-bash">Delete this Bash</button>
        <p class="muted small" style="margin:4px 0 0">Removes the page, gifts and all records for good. Guests' links will stop working.</p>
      </section>
      </div>
      </div>`;
  }

  const markQuizDirty = () => {
    if (S.quizDirty) return;
    S.quizDirty = true;
    const b = document.getElementById('q-save'); if (b) b.hidden = false;
    const w = document.getElementById('q-reset-warn'); if (w && S.r.players) w.hidden = false;
  };
  const quizRerender = () => { S.quizDirty = true; render(); };
  H['input:qq'] = el => { S.quiz[+el.dataset.i].question = el.value; markQuizDirty(); };
  H['input:qo'] = el => { S.quiz[+el.dataset.i].options[+el.dataset.j] = el.value; markQuizDirty(); };
  H['change:qc'] = el => { S.quiz[+el.dataset.i].correct = +el.dataset.j; markQuizDirty(); };
  H['q-add'] = () => { S.quiz.push({ question: '', options: ['', ''], correct: null }); quizRerender(); const qs = app.querySelectorAll('[data-h="qq"]'); if (qs.length) qs[qs.length - 1].focus(); };
  H['q-del'] = el => { S.quiz.splice(+el.dataset.i, 1); quizRerender(); };
  H['o-add'] = el => { S.quiz[+el.dataset.i].options.push(''); quizRerender(); };
  H['o-del'] = el => {
    const q = S.quiz[+el.dataset.i], j = +el.dataset.j;
    q.options.splice(j, 1);
    if (q.correct === j) q.correct = null; else if (q.correct > j) q.correct--;
    quizRerender();
  };
  H['q-starter'] = () => {
    const first = (S.r.host_name || '').split(' ')[0];
    S.quiz = (QUIZ_STARTERS[S.r.occasion] || QUIZ_STARTERS.other).map(t => ({ question: t.replace(/\{n\}/g, first), options: ['', '', ''], correct: null }));
    quizRerender();
    toast('Starter questions added. Fill in the answers and tick the right one.');
  };
  H['q-save'] = async el => {
    const qs = [];
    for (let i = 0; i < S.quiz.length; i++) {
      const q = S.quiz[i];
      if (!q.question.trim()) return toast(`Question ${i + 1} needs some text.`);
      const kept = q.options.map((o, j) => ({ o: o.trim(), j })).filter(x => x.o);
      if (kept.length < 2) return toast(`Question ${i + 1} needs at least 2 answers.`);
      const correct = kept.findIndex(x => x.j === q.correct);
      if (correct < 0) return toast(`Tick the right answer for question ${i + 1}.`);
      qs.push({ question: q.question.trim(), options: kept.map(x => x.o), correct });
    }
    busy(el, true);
    try {
      const res = await api.saveQuiz(slug, tok, qs);
      S.quizDirty = false;
      toast(res.reset ? 'Quiz saved. The leaderboard was reset.' : 'Quiz saved');
      await refresh();
    } catch (e) { busy(el, false); toast(e.message); }
  };
  H['lb-del'] = async el => {
    if (!confirm('Take this name off the leaderboard?')) return;
    try { await api.deleteQuizPlay(slug, tok, el.dataset.id); toast('Removed'); } catch (e) { toast(e.message); }
    refresh();
  };
  H['goto-plus'] = () => { const el = document.getElementById('plus-sec'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  H['upgrade'] = async el => {
    busy(el, true, 'Opening payment…');
    try {
      const o = await api.startUpgrade(slug, tok);
      if (o.already) { toast('This Bash already has Plus'); busy(el, false); return refresh(); }
      await loadRazorpay();
      const rzp = new window.Razorpay({
        key: o.key_id, order_id: o.order_id, amount: o.amount, currency: o.currency,
        name: 'Bash', description: 'Bash Plus · ' + S.r.title,
        prefill: { name: o.name || '', email: o.email || '' },
        notes: { slug },
        theme: { color: '#E6007A' },
        handler: async resp => {
          S.pay = 'confirming'; render(); window.scrollTo(0, 0);
          try { await api.verifyUpgrade(slug, resp); } catch (e) { /* the webhook can still unlock it */ }
          confirmPlus();
        },
        modal: { ondismiss: () => busy(el, false) }
      });
      rzp.on('payment.failed', r => { toast((r && r.error && r.error.description) || 'Payment failed. You weren’t charged. Try again.'); });
      rzp.open();
    } catch (e) { busy(el, false); toast(e.message); }
  };
  H['toggle-details'] = () => { S.editDetails = !S.editDetails; render(); if (S.editDetails) app.querySelector('form[data-form="details"]').scrollIntoView({ block: 'start' }); };
  H['reveal'] = () => { S.reveal = !S.reveal; render(); };
  H['copy'] = el => copyText(el.dataset.text);
  H['native-share'] = () => navigator.share({ title: S.r.title, text: S.r.title + ' — gift list', url: guestUrl(S.r.slug) }).catch(() => {});
  H['edit-item'] = el => { S.editItem = el.dataset.id; delete S.photo[el.dataset.id]; render(); };
  H['cancel-edit'] = () => { delete S.photo[S.editItem]; S.editItem = null; render(); };
  H['change:fund_enabled'] = fundToggle;
  H['change:photo'] = async el => {
    const key = el.dataset.key, file = el.files && el.files[0];
    if (!file) return;
    const form = el.closest('form');
    const ph = form.querySelector('.ph');
    ph.textContent = '…';
    const submit = form.querySelector('[type=submit]');
    submit.disabled = true;
    try {
      S.photo[key] = await uploadPhoto(file);
      ph.innerHTML = `<img src="${esc(S.photo[key])}" alt="">`;
      el.closest('.file-btn').firstChild.textContent = 'Change photo';
      if (!form.querySelector('[data-act="photo-remove"]')) {
        el.closest('.btn-row').insertAdjacentHTML('beforeend', `<button class="link" type="button" data-act="photo-remove" data-key="${esc(key)}">Remove</button>`);
      }
    } catch (e) {
      ph.innerHTML = S.photo[key] ? `<img src="${esc(S.photo[key])}" alt="">` : '📷';
      toast(e.message);
    }
    submit.disabled = false;
    el.value = '';
  };
  H['photo-remove'] = el => {
    const key = el.dataset.key;
    S.photo[key] = '';
    const form = el.closest('form');
    form.querySelector('.ph').textContent = '📷';
    form.querySelector('.file-btn').firstChild.textContent = 'Add photo';
    el.remove();
  };
  H['del-item'] = async el => {
    const it = S.r.items.find(i => i.id === el.dataset.id);
    if (!it) return;
    const warn = it.claimed ? `Someone has already claimed “${it.name}”. Remove it anyway?`
      : it.chippers ? `${people(it.chippers)} already chipped in for “${it.name}”. Remove it and those records?` : `Remove “${it.name}”?`;
    if (!confirm(warn)) return;
    try { await api.deleteItem(slug, tok, it.id); toast('Gift removed'); } catch (e) { toast(e.message); }
    refresh();
  };
  H['release'] = async el => {
    const it = S.r.items.find(i => i.id === el.dataset.id);
    if (!it || !confirm(`Free up “${it.name}” so another guest can pick it?`)) return;
    try { await api.releaseItem(slug, tok, it.id); toast('Gift is available again'); } catch (e) { toast(e.message); }
    refresh();
  };
  H['delete-bash'] = async el => {
    if (!confirm(`Delete “${S.r.title}” for good? The guest page, gifts and every record go with it. This can't be undone.`)) return;
    busy(el, true, 'Deleting…');
    try {
      await api.deleteRegistry(slug, tok);
      forgetBash(slug);
      toast('Bash deleted');
      location.hash = '#/';
    } catch (e) { busy(el, false); toast(e.message); }
  };
  H['submit:details'] = async (form, btn) => {
    const { data, error } = readDetails(form);
    if (error) return showError(form, error);
    busy(btn, true);
    try { await api.updateRegistry(slug, tok, data); S.editDetails = false; toast('Details saved'); await refresh(); }
    catch (e) { busy(btn, false); showError(form, e.message); }
  };
  H['submit:item'] = async (form, btn) => {
    const f = new FormData(form);
    const key = form.dataset.key;
    const existing = S.r.items.find(i => i.id === key);
    const item = {
      id: String(f.get('id') || '') || null,
      name: String(f.get('name') || '').trim(),
      price: f.get('price') ? Math.round(Number(f.get('price'))) : null,
      url: String(f.get('url') || '').trim(),
      note: String(f.get('note') || '').trim(),
      image_url: S.photo[key] !== undefined ? S.photo[key] : ((existing && existing.image_url) || ''),
      group_gift: !!f.get('group_gift')
    };
    if (!item.name) return showError(form, 'Give the gift a name.');
    if (item.url && !safeUrl(item.url)) return showError(form, 'Links need to start with https://');
    if (item.price !== null && !(item.price > 0)) return showError(form, 'Price needs to be a number above zero, or leave it blank.');
    if (item.group_gift && !item.price) return showError(form, 'Add a price so guests know how much to chip in toward.');
    busy(btn, true);
    try {
      await api.saveItem(slug, tok, item);
      toast(item.id ? 'Gift saved' : 'Gift added');
      delete S.photo[key];
      S.editItem = null; S.fresh = false;
      await refresh();
      if (!item.id) { const inp = app.querySelector('.panel form[data-form="item"] input[name="name"]'); if (inp) inp.focus(); }
    } catch (e) { busy(btn, false); showError(form, e.message); }
  };

  async function confirmPlus() {
    try { await load(); } catch (e) { /* keep polling */ }
    if (S.r.plus) { S.pay = 'done'; toast('Bash Plus unlocked 🎉'); render(); return; }
    let tries = 0;
    const timer = setInterval(async () => {
      tries++;
      if (!document.body.contains(app) || location.hash.indexOf('#/m/' + enc(slug)) !== 0) return clearInterval(timer);
      try { await load(); } catch (e) { /* keep trying */ }
      if (S.r.plus) { clearInterval(timer); S.pay = 'done'; toast('Bash Plus unlocked 🎉'); render(); }
      else if (tries >= 20) { clearInterval(timer); S.pay = 'slow'; render(); }
    }, 2500);
  }

  render();
  if (S.pay === 'confirming') confirmPlus();
}

/* ---------- guest ---------- */
async function viewGuest(slug) {
  loading();
  const S = { r: null, claiming: null, chipping: null, pays: {}, qz: { step: 'intro', i: 0, answers: [], name: store.get(KEY_NAME, ''), error: '' } };
  const QKEY = 'bash_quiz:' + slug;
  async function load() { S.r = await api.getRegistry(slug, null); }
  try { await load(); } catch (e) { return viewMessage("Couldn't load this Bash", e.message); }
  if (!S.r) return viewMessage("We couldn't find this Bash", 'Check the link with whoever sent it — part of it may be missing, or the host may have deleted it.');

  const claims = () => store.get(KEY_CLAIMS, {});
  const itemById = id => S.r.items.find(i => i.id === id);
  async function refresh() {
    const before = S.r ? tierOf(S.r) : 0;
    try { await load(); } catch (e) { toast(e.message); }
    renderGifts(); renderFund(); renderMilestones(); renderQuiz();
    const after = tierOf(S.r);
    if (after > before) {
      const label = (MILESTONES.find(([v]) => v === after) || [0, ''])[1];
      confetti();
      toast(after === 100 ? (S.r.reveal_message ? 'You unlocked the surprise! 🎉' : 'Every gift is sorted! 🎉') : `You helped unlock “${label}”!`);
      if (after === 100) store.set('bash_seen100:' + slug, true);
    }
  }
  function renderMilestones() {
    const el = document.getElementById('mile-sec');
    if (el) el.innerHTML = milestoneHtml(S.r, false);
  }

  function renderQuiz() {
    const el = document.getElementById('quiz-sec');
    if (!el) return;
    const r = S.r, qs = r.quiz || [], Q = S.qz;
    if (!qs.length) { el.innerHTML = ''; return; }
    const played = store.get(QKEY, null);
    const host = esc(r.host_name);
    const meta = `${qs.length} ${qs.length === 1 ? 'question' : 'questions'}${r.players ? ` · ${people(r.players)} played` : ''}`;
    let body;
    if (played && Q.step !== 'review') {
      const res = played;
      body = `
        <div class="quiz-result">
          <div class="quiz-score">${res.score}<span>/${res.total}</span></div>
          <p style="margin:4px 0 0"><strong>${res.score === res.total ? 'Perfect score! 🏆' : res.rank <= 3 ? `You’re #${res.rank}!` : `You’re #${res.rank} of ${r.players}`}</strong></p>
          <div class="btn-row" style="justify-content:center;margin-top:14px">
            <a class="btn wa sm" href="https://wa.me/?text=${enc(`I scored ${res.score}/${res.total} on “How well do you know ${r.host_name}?” 🎯 Think you can beat me?\n${guestUrl(r.slug)}`)}" target="_blank" rel="noopener noreferrer">Challenge friends</a>
            <button class="btn ghost sm" data-act="quiz-review">See answers</button>
          </div>
        </div>
        ${r.leaderboard.length ? `<h3 class="quiz-lb-title">Leaderboard</h3>${leaderboardHtml(r.leaderboard, (res.name || '').toLowerCase())}` : ''}`;
    } else if (Q.step === 'review' && played) {
      body = `<ol class="quiz-review">${qs.map((q, i) => {
          const mine = played.answers[i], right = played.correct[i];
          return `<li><strong>${esc(q.question)}</strong>
            <span class="${mine === right ? 'ok' : 'no'}">${mine === right ? '✓' : '✗'} ${esc(q.options[mine])}</span>
            ${mine === right ? '' : `<span class="muted small">Answer: ${esc(q.options[right])}</span>`}</li>`;
        }).join('')}</ol>
        <button class="link" data-act="quiz-back">Back to leaderboard</button>`;
    } else if (Q.step === 'play') {
      const q = qs[Q.i];
      body = `
        <div class="quiz-dots" aria-hidden="true">${qs.map((_, i) => `<span class="${i < Q.i ? 'done' : i === Q.i ? 'now' : ''}"></span>`).join('')}</div>
        <p class="muted small" style="margin:0">Question ${Q.i + 1} of ${qs.length}</p>
        <h3 class="quiz-q">${esc(q.question)}</h3>
        <div class="quiz-opts">${q.options.map((o, j) => `<button class="quiz-opt" data-act="quiz-pick" data-j="${j}">${esc(o)}</button>`).join('')}</div>
        ${Q.i > 0 ? '<button class="link" data-act="quiz-prev" style="margin-top:10px">‹ Previous question</button>' : ''}`;
    } else if (Q.step === 'sending') {
      body = `<p class="muted" style="text-align:center;margin:20px 0">Adding up your score…</p>`;
    } else {
      const named = Q.step === 'rename';
      body = `
        ${r.leaderboard.length && !named ? `<h3 class="quiz-lb-title">Top players</h3>${leaderboardHtml(r.leaderboard.slice(0, 3), '')}` : ''}
        <form data-form="${named ? 'quiz-rename' : 'quiz-start'}" novalidate style="margin-top:14px">
          <label class="field"><span>${named ? 'Pick a different name' : 'Your name for the leaderboard'}</span>
            <input type="text" name="qname" maxlength="40" autocomplete="name" value="${esc(Q.name)}" placeholder="e.g. Aman K"></label>
          ${Q.error ? `<p class="form-error" role="alert">${esc(Q.error)}</p>` : ''}
          <button class="btn" type="submit">${named ? 'Save my score' : 'Start the quiz'}</button>
        </form>`;
    }
    el.innerHTML = `
      <div class="panel quiz-card">
        <div class="quiz-head"><span class="quiz-emoji" aria-hidden="true">🎯</span>
          <div><h2 class="h2" style="margin:0">How well do you know ${host}?</h2><p class="muted small" style="margin:2px 0 0">${meta}</p></div></div>
        ${body}
      </div>`;
  }
  async function submitQuiz() {
    const Q = S.qz;
    Q.step = 'sending'; renderQuiz();
    try {
      const res = await api.submitQuiz(slug, Q.name, Q.answers);
      store.set(QKEY, Object.assign({}, res, { answers: Q.answers.slice() }));
      store.set(KEY_NAME, Q.name);
      Q.step = 'result'; Q.error = '';
      try { await load(); } catch (e) { /* keep showing result */ }
      renderQuiz();
      if (res.score === res.total || res.rank <= 3) confetti();
      document.getElementById('quiz-sec').scrollIntoView({ block: 'start', behavior: 'smooth' });
    } catch (e) {
      Q.step = /already played/i.test(e.message) ? 'rename' : 'intro';
      Q.error = e.message; renderQuiz();
    }
  }

  function chipOptions(it) {
    const left = Math.max(0, (it.price || 0) - it.funded);
    const chips = [500, 1000, 2000, 5000].filter(v => v < left).slice(0, 3).map(v => ({ v, label: inr(v) }));
    if (left > 0) chips.push({ v: left, label: 'The rest · ' + inr(left) });
    return chips;
  }
  function payState(key) {
    if (!S.pays[key]) {
      const it = key === 'fund' ? null : itemById(key);
      const first = it ? (chipOptions(it)[0] || { v: 500 }).v : 1100;
      S.pays[key] = { step: 'form', amount: first, custom: false, name: store.get(KEY_NAME, ''), message: '' };
    }
    return S.pays[key];
  }
  const rerender = key => key === 'fund' ? renderFund() : renderGifts();

  function giftRow(it) {
    const mine = !!claims()[it.id];
    const url = safeUrl(it.url);
    const thumb = it.image_url ? `<img class="thumb" src="${esc(it.image_url)}" alt="" loading="lazy">` : '';
    let side = '', extra = '', cls = '';

    if (it.group_gift) {
      const full = it.price && it.funded >= it.price;
      extra = `${meterHtml(it.funded, it.price)}
        <p class="fundline"><strong>${inr(it.funded)}</strong> of ${inr(it.price)} chipped in${it.chippers ? ` by ${people(it.chippers)}` : ''}</p>`;
      if (S.chipping === it.id) {
        extra += `<div class="inline-form">${payBlock(it.id, payState(it.id), S.r, {
          chips: chipOptions(it), msgLabel: `A note for ${esc(S.r.host_name)}`, upiNote: 'Gift: ' + it.name,
          doneWhat: 'you chipped in', againLabel: 'Close', cancel: true })}</div>`;
      } else if (full) side = '<span class="tag done">Fully funded 🎉</span>';
      else side = `<button class="btn sm" data-act="chip-open" data-id="${esc(it.id)}">Chip in</button>`;
    } else if (mine) {
      cls = 'mine-claim';
      side = `<span class="tag yours">You're getting this</span><button class="link" data-act="unclaim" data-id="${esc(it.id)}">Undo</button>`;
    } else if (it.claimed) {
      cls = 'taken';
      side = '<span class="tag">Taken</span>';
    } else if (S.claiming === it.id) {
      extra = `
        <form data-form="claim" class="inline-form" novalidate>
          <input type="hidden" name="id" value="${esc(it.id)}">
          <label class="field"><span>Your name</span><input type="text" name="name" maxlength="60" autocomplete="name" value="${esc(store.get(KEY_NAME, ''))}" placeholder="So ${esc(S.r.host_name)} knows who to thank"></label>
          <label class="field"><span>A note for ${esc(S.r.host_name)} <em class="opt">optional</em></span><input type="text" name="note" maxlength="280" placeholder="Only shown if they choose to peek"></label>
          <div class="btn-row"><button class="btn sm" type="submit">Reserve it</button><button class="btn ghost sm" type="button" data-act="claim-cancel">Cancel</button></div>
        </form>`;
    } else {
      side = `<button class="btn sm" data-act="claim-open" data-id="${esc(it.id)}">I'll get this</button>`;
    }
    const showDetails = !it.claimed || mine;
    return `
      <li class="gift ${cls}">
        <div class="gift-top">
          ${thumb}
          <div class="gift-main">
            <div class="gift-name">${esc(it.name)}</div>
            <div class="gift-meta">${it.price ? `<span class="price">${inr(it.price)}</span>` : ''}${url && showDetails ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${mine ? 'Buy it on ' : 'See it on '}${esc(domain(url))}</a>` : ''}</div>
            ${it.note && showDetails ? `<p class="gift-note">${esc(it.note)}</p>` : ''}
            ${extra}
          </div>
        </div>
        ${side ? `<div class="gift-side">${side}</div>` : ''}
      </li>`;
  }

  function renderGifts() {
    const el = document.getElementById('gifts-sec');
    if (!el) return;
    const items = S.r.items;
    if (!items.length) { el.innerHTML = S.r.fund_enabled ? '' : '<div class="panel empty">Nothing on the list yet. Check back soon.</div>'; return; }
    const normal = items.filter(i => !i.group_gift);
    const open = normal.filter(i => !i.claimed).length;
    el.innerHTML = `
      <div class="section-head"><div><h2 class="h2">Gift list</h2><p class="muted small" style="margin:0">${normal.length ? `Reserve something and it's marked as taken, so nobody doubles up. ${open} of ${normal.length} still up for grabs.` : 'Chip in together on something bigger.'}</p></div></div>
      <ul class="gifts">${items.map(giftRow).join('')}</ul>`;
  }

  function renderFund() {
    const el = document.getElementById('fund-sec');
    if (!el) return;
    const r = S.r;
    if (!r.fund_enabled || !r.upi_id) { el.innerHTML = ''; return; }
    const meter = (r.fund_goal || r.contributors) ? `
      <div class="meter">
        ${r.fund_goal ? `<div class="meter-bar" role="progressbar" aria-valuemin="0" aria-valuemax="${r.fund_goal}" aria-valuenow="${r.raised}"><div class="meter-fill" style="width:${Math.min(100, r.raised / r.fund_goal * 100)}%"></div></div>` : ''}
        <div class="meter-label">${r.contributors ? `<span><strong>${inr(r.raised)}</strong> from ${people(r.contributors)}</span>` : '<span>Be the first to send shagun</span>'}${r.fund_goal ? `<span class="muted">Goal ${inr(r.fund_goal)}</span>` : ''}</div>
      </div>` : '';
    el.innerHTML = `
      <h2 class="h2">Shagun fund</h2>
      <p class="muted small" style="margin:0">Rather send cash? Pick an amount and pay by UPI.</p>
      ${meter}
      <div class="panel" style="margin-top:14px">${payBlock('fund', payState('fund'), r, {
        chips: SHAGUN.map(v => ({ v, label: inr(v) })), msgLabel: 'Blessings or a message', upiNote: 'Shagun: ' + r.title,
        doneWhat: 'your shagun and message', againLabel: 'Send more', cancel: false })}</div>`;
  }

  function render() {
    const r = S.r;
    const dt = dateInfo(r.event_date);
    const tok = myTokenFor(r.slug);
    document.title = r.title + ' · Bash';
    app.innerHTML = `
      ${tok ? `<div class="owner-bar"><span>This is your Bash. This is what guests see.</span><a class="link" href="#/m/${enc(r.slug)}/${enc(tok)}">Back to editing</a></div>` : ''}
      <div class="layout">
      <aside class="side">
      <section class="invite">
        <span class="emo-big" aria-hidden="true">${occ(r.occasion).emoji}</span>
        <h1>${esc(r.title)}</h1>
        <p class="host">Hosted by <strong>${esc(r.host_name)}</strong></p>
        ${dt ? `<div class="when"><span class="pill soft">${esc(dt.pretty)}</span>${dt.rel ? `<span class="pill">${esc(dt.rel)}</span>` : ''}</div>` : ''}
        ${r.message ? `<blockquote class="letter" style="margin-left:0;margin-right:0">${esc(r.message)}<cite>— ${esc(r.host_name)}</cite></blockquote>` : ''}
      </section>
      <section class="section" id="mile-sec"></section>
      <section class="section" id="quiz-sec"></section>
      </aside>
      <div class="main">
        <section class="section" id="gifts-sec"></section>
        <section class="section" id="fund-sec"></section>
      </div>
      </div>
      <div class="cta-own"><p>Got your own occasion coming up?</p><a class="btn ghost" href="#/new">Start your own Bash</a></div>`;
    renderGifts(); renderFund(); renderMilestones(); renderQuiz();
    if (tierOf(r) === 100 && !store.get('bash_seen100:' + slug, false)) { store.set('bash_seen100:' + slug, true); setTimeout(confetti, 400); }
  }

  /* quiz */
  H['submit:quiz-start'] = form => {
    const name = String(new FormData(form).get('qname') || '').trim();
    if (!name) return showError(form, 'Add your name for the leaderboard.');
    Object.assign(S.qz, { name, step: 'play', i: 0, answers: [], error: '' });
    renderQuiz();
  };
  H['submit:quiz-rename'] = form => {
    const name = String(new FormData(form).get('qname') || '').trim();
    if (!name) return showError(form, 'Add your name for the leaderboard.');
    S.qz.name = name; submitQuiz();
  };
  H['quiz-pick'] = el => {
    const Q = S.qz;
    Q.answers[Q.i] = +el.dataset.j;
    el.classList.add('picked');
    setTimeout(() => {
      if (Q.i < S.r.quiz.length - 1) { Q.i++; renderQuiz(); } else submitQuiz();
    }, 180);
  };
  H['quiz-prev'] = () => { S.qz.i = Math.max(0, S.qz.i - 1); renderQuiz(); };
  H['quiz-review'] = () => { S.qz.step = 'review'; renderQuiz(); };
  H['quiz-back'] = () => { S.qz.step = 'result'; renderQuiz(); };

  /* reserving gifts */
  H['claim-open'] = el => { S.claiming = el.dataset.id; S.chipping = null; renderGifts(); const i = app.querySelector('form[data-form="claim"] input[name="name"]'); if (i) i.focus(); };
  H['claim-cancel'] = () => { S.claiming = null; renderGifts(); };
  H['submit:claim'] = async (form, btn) => {
    const f = new FormData(form);
    const id = String(f.get('id')), name = String(f.get('name') || '').trim(), note = String(f.get('note') || '').trim();
    if (!name) return showError(form, `Add your name so ${S.r.host_name} knows who it's from.`);
    busy(btn, true, 'Reserving…');
    try {
      const res = await api.claimItem(id, name, note);
      store.set(KEY_NAME, name);
      S.claiming = null;
      if (res && res.ok) { const c = claims(); c[id] = res.claim_token; store.set(KEY_CLAIMS, c); toast("Reserved! It's yours to get."); }
      else toast('Someone just grabbed that one. Pick another?');
      await refresh();
    } catch (e) { busy(btn, false); showError(form, e.message); }
  };
  H['unclaim'] = async el => {
    const id = el.dataset.id, c = claims();
    if (!confirm('Give this gift back so someone else can pick it?')) return;
    try {
      await api.unclaimItem(id, c[id]);
      delete c[id]; store.set(KEY_CLAIMS, c);
      toast("Done — it's back on the list");
    } catch (e) { toast(e.message); }
    refresh();
  };

  /* paying: shagun fund ('fund') and chip-ins (item id) */
  const keyOf = el => el.dataset.key || (el.form && el.form.dataset.key) || '';
  const setPayLabel = key => {
    const b = app.querySelector(`[data-paygo="${key}"]`);
    const P = S.pays[key];
    if (b && P) b.textContent = P.amount > 0 ? `Pay ${inr(P.amount)} with UPI` : 'Pay with UPI';
  };
  H['chip-open'] = el => { S.chipping = el.dataset.id; S.claiming = null; delete S.pays[el.dataset.id]; renderGifts(); };
  H['chip-cancel'] = () => { S.chipping = null; renderGifts(); };
  H['amt'] = el => {
    const key = keyOf(el), P = payState(key);
    P.amount = Number(el.dataset.v); P.custom = false;
    el.closest('form').querySelectorAll('.amt').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
    const c = el.closest('form').querySelector('input[name="custom"]'); if (c) c.value = '';
    setPayLabel(key);
  };
  H['input:custom'] = el => {
    const key = keyOf(el), P = payState(key);
    const v = Math.round(Number(el.value));
    if (el.value) { P.custom = true; P.amount = v > 0 ? v : 0; el.form.querySelectorAll('.amt').forEach(b => b.setAttribute('aria-pressed', 'false')); }
    setPayLabel(key);
  };
  H['input:pname'] = el => { payState(keyOf(el)).name = el.value; };
  H['input:pmsg'] = el => { payState(keyOf(el)).message = el.value; };
  H['submit:pay'] = form => {
    const key = form.dataset.key, P = payState(key);
    const f = new FormData(form);
    P.name = String(f.get('pname') || '').trim();
    P.message = String(f.get('pmsg') || '').trim();
    if (!(P.amount >= 1)) return showError(form, 'Pick an amount or type your own.');
    if (!P.name) return showError(form, `Add your name so ${S.r.host_name} knows who it's from.`);
    store.set(KEY_NAME, P.name);
    P.step = 'pay'; rerender(key);
    const it = key === 'fund' ? null : itemById(key);
    if (IS_MOBILE) location.href = upiLink(S.r, P.amount, it ? 'Gift: ' + it.name : 'Shagun: ' + S.r.title);
  };
  H['copy-upi'] = () => copyText(S.r.upi_id, 'UPI ID copied');
  H['pay-back'] = el => { payState(keyOf(el)).step = 'form'; rerender(keyOf(el)); };
  H['pay-again'] = el => {
    const key = keyOf(el);
    if (key === 'fund') { const P = payState(key); P.step = 'form'; P.message = ''; renderFund(); }
    else { S.chipping = null; delete S.pays[key]; renderGifts(); }
  };
  H['paid'] = async el => {
    const key = keyOf(el), P = payState(key);
    busy(el, true, 'Sending…');
    try {
      await api.addContribution(slug, P.name, P.amount, P.message, key === 'fund' ? null : key);
      P.step = 'done';
      await refresh();
    } catch (e) { busy(el, false); toast(e.message); }
  };

  render();
}

/* ---------- messages ---------- */
function viewMessage(title, text, href, label) {
  document.title = title;
  app.innerHTML = `
    <div class="page-head narrow" style="padding-top:60px">
      <h1>${esc(title)}</h1>
      <p class="muted" style="margin-top:10px;max-width:44ch">${esc(text)}</p>
      <div class="btn-row" style="margin-top:20px">
        ${href ? `<a class="btn" href="${esc(href)}">${esc(label)}</a>` : ''}
        <a class="btn ${href ? 'ghost' : ''}" href="#/">Go to Bash home</a>
      </div>
    </div>`;
}

route();
})();
</script>
</body>
</html>
